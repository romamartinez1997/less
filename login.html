<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — BEAUTY GLOW</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-mode=""><div id="hdr"></div><div class="page"><div class="wrap"><div class="box"><div class="tabs"><button class="btn" id="t1">Вход</button><button class="btn ghost" id="t2">Регистрация</button></div><form id="lf"><input name="e" type="email" placeholder="Email" required><input name="p" type="password" placeholder="Пароль" required><button class="btn">Войти</button></form><form id="rf" hidden><input name="n" placeholder="Имя" required><input name="e" type="email" placeholder="Email" required><input name="p" type="password" minlength="6" placeholder="Пароль (мин. 6)" required><button class="btn">Зарегистрироваться</button></form><p style="font-size:.75rem;margin-top:10px">Демо: данные хранятся только в вашем браузере.</p></div></div></div>
<div id="ftr"></div><script src="js/products.js"></script><script src="js/main.js"></script><script>const s=(a,b)=>{$('#lf').hidden=!a;$('#rf').hidden=a;$('#t1').className='btn'+(a?'':' ghost');$('#t2').className='btn'+(a?' ghost':'')};$('#t1').onclick=()=>s(1);$('#t2').onclick=()=>s(0);
$('#rf').onsubmit=e=>{e.preventDefault();const f=e.target,u=LS.get('bg_users',[]);if(u.some(x=>x.e==f.e.value))return toast('Email уже зарегистрирован');u.push({n:f.n.value,e:f.e.value,p:f.p.value});LS.set('bg_users',u);LS.set('bg_user',{name:f.n.value,email:f.e.value});location.href='profile.html'};
$('#lf').onsubmit=e=>{e.preventDefault();const f=e.target,u=LS.get('bg_users',[]).find(x=>x.e==f.e.value&&x.p==f.p.value);if(!u)return toast('Неверный email или пароль');LS.set('bg_user',{name:u.n,email:u.e});location.href='profile.html'}</script></body></html>
