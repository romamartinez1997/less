<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — BEAUTY GLOW</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-mode=""><div id="hdr"></div><div class="page"><div class="wrap"><h1>Личный кабинет</h1><div id="pf"></div></div></div>
<script>const u=LS.get('bg_user',null);if(!u)$('#pf').innerHTML='<div class="empty"><p>Войдите, чтобы открыть кабинет</p><a class="btn" href="login.html">Войти</a></div>';else{const o=LS.get('bg_orders',[]);$('#pf').innerHTML=`<p>Здравствуйте, <b>${u.name}</b> (${u.email})</p><h3>Мои заказы</h3>${o.length?o.map(x=>`<div class="srow"><span>${x.id} · ${x.date}<br><small>${x.items.map(i=>i.n+' ×'+i.q).join(', ')}</small></span><b>${fmt(x.total)}</b></div>`).join(''):'<p>Заказов пока нет.</p>'}<p><a class="btn" href="catalog.html">В каталог</a> <button class="btn ghost" id="out">Выйти</button></p>`;$('#out').onclick=()=>{localStorage.removeItem('bg_user');location.href='index.html'}}</script><div id="ftr"></div><script src="js/products.js"></script><script src="js/main.js"></script></body></html>
